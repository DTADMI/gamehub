<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a"/>
      <stop offset="50%" stop-color="#1a1423"/>
      <stop offset="100%" stop-color="#162447"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7b5ea7"/>
      <stop offset="50%" stop-color="#d4a853"/>
      <stop offset="100%" stop-color="#4e9a5c"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="0" x2="1200" y2="0" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="480" x2="1200" y2="480" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="white" stroke-width="0.5"/>
    <line x1="120" y1="0" x2="120" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="240" y1="0" x2="240" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="360" y1="0" x2="360" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="480" y1="0" x2="480" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="720" y1="0" x2="720" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="840" y1="0" x2="840" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="960" y1="0" x2="960" y2="630" stroke="white" stroke-width="0.5"/>
    <line x1="1080" y1="0" x2="1080" y2="630" stroke="white" stroke-width="0.5"/>
  </g>

  <!-- Accent line -->
  <rect x="100" y="260" width="1000" height="4" rx="2" fill="url(#accent)" opacity="0.8"/>

  <!-- Title -->
  <text x="600" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="72" font-weight="bold" fill="#f0e6d3" letter-spacing="-1">GameHub</text>

  <!-- Subtitle -->
  <text x="600" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" fill="#c4b8a6">20 Games · Point &amp; Click Adventures · Arcade Classics</text>

  <!-- Bottom info -->
  <text x="600" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" fill="#8a7e6e">gamehub.vercel.app</text>

  <!-- Decorative game icons row -->
  <g transform="translate(100, 400)" opacity="0.3">
    <rect x="0" y="0" width="48" height="48" rx="8" fill="#7b5ea7"/>
    <text x="24" y="32" text-anchor="middle" font-size="24" fill="white">🎮</text>
    <rect x="64" y="0" width="48" height="48" rx="8" fill="#d4a853"/>
    <text x="88" y="32" text-anchor="middle" font-size="24" fill="white">🧩</text>
    <rect x="128" y="0" width="48" height="48" rx="8" fill="#4e9a5c"/>
    <text x="152" y="32" text-anchor="middle" font-size="24" fill="white">🎯</text>
    <rect x="192" y="0" width="48" height="48" rx="8" fill="#3b82f6"/>
    <text x="216" y="32" text-anchor="middle" font-size="24" fill="white">🐍</text>
    <rect x="256" y="0" width="48" height="48" rx="8" fill="#f97316"/>
    <text x="280" y="32" text-anchor="middle" font-size="24" fill="white">💎</text>
    <rect x="320" y="0" width="48" height="48" rx="8" fill="#a855f7"/>
    <text x="344" y="32" text-anchor="middle" font-size="24" fill="white">⭐</text>
    <rect x="384" y="0" width="48" height="48" rx="8" fill="#7b5ea7"/>
    <text x="408" y="32" text-anchor="middle" font-size="24" fill="white">🕹</text>
    <rect x="448" y="0" width="48" height="48" rx="8" fill="#d4a853"/>
    <text x="472" y="32" text-anchor="middle" font-size="24" fill="white">♟</text>
    <rect x="512" y="0" width="48" height="48" rx="8" fill="#4e9a5c"/>
    <text x="536" y="32" text-anchor="middle" font-size="24" fill="white">🃏</text>
    <rect x="576" y="0" width="48" height="48" rx="8" fill="#3b82f6"/>
    <text x="600" y="32" text-anchor="middle" font-size="24" fill="white">🎲</text>
    <rect x="640" y="0" width="48" height="48" rx="8" fill="#f97316"/>
    <text x="664" y="32" text-anchor="middle" font-size="24" fill="white">🏰</text>
    <rect x="704" y="0" width="48" height="48" rx="8" fill="#a855f7"/>
    <text x="728" y="32" text-anchor="middle" font-size="24" fill="white">✨</text>
