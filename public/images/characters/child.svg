<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="childSkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5d0b0"/><stop offset="100%" stop-color="#e8c0a0"/>
    </linearGradient>
  </defs>
  <!-- Body/pajamas -->
  <rect x="32" y="68" width="56" height="38" rx="10" fill="#6090c0"/>
  <rect x="38" y="72" width="44" height="30" rx="6" fill="#70a0d0"/>
  <!-- Pajama stars -->
  <text x="48" y="88" fill="#a0d0ff" font-size="10" opacity="0.6">★</text>
  <text x="68" y="94" fill="#a0d0ff" font-size="8" opacity="0.5">✦</text>
  <!-- Head -->
  <circle cx="60" cy="42" r="26" fill="url(#childSkin)"/>
  <!-- Hair -->
  <ellipse cx="60" cy="22" rx="28" ry="14" fill="#4a3020"/>
  <ellipse cx="48" cy="28" rx="8" ry="6" fill="#3d2010"/>
  <ellipse cx="72" cy="28" rx="8" ry="6" fill="#3d2010"/>
  <!-- Eyes (wide, curious) -->
  <circle cx="50" cy="40" r="5" fill="#3a2010"/>
  <circle cx="70" cy="40" r="5" fill="#3a2010"/>
  <circle cx="51.5" cy="38.5" r="2" fill="white" opacity="0.8"/>
  <circle cx="71.5" cy="38.5" r="2" fill="white" opacity="0.8"/>
  <!-- Rosy cheeks -->
  <circle cx="42" cy="48" r="4" fill="#ff8888" opacity="0.25"/>
  <circle cx="78" cy="48" r="4" fill="#ff8888" opacity="0.25"/>
  <!-- Smile -->
  <path d="M52 52 Q60 60 68 52" stroke="#3a2010" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Arms holding something -->
  <rect x="18" y="72" width="14" height="7" rx="3.5" fill="#f5d0b0"/>
  <rect x="88" y="72" width="14" height="7" rx="3.5" fill="#f5d0b0"/>
  <!-- Holding a gear -->
  <circle cx="24" cy="76" r="5" fill="#ffd700" opacity="0.5" stroke="#b8960a" stroke-width="0.5"/>
</svg>