<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="toySkin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a574"/><stop offset="100%" stop-color="#b8956e"/>
    </linearGradient>
    <linearGradient id="toyHat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5c3d2e"/><stop offset="100%" stop-color="#3d2a18"/>
    </linearGradient>
  </defs>
  <!-- Body/apron -->
  <rect x="35" y="65" width="50" height="40" rx="8" fill="#8b7355"/>
  <rect x="38" y="68" width="44" height="34" rx="6" fill="#a08060"/>
  <!-- Head -->
  <circle cx="60" cy="45" r="28" fill="url(#toySkin)"/>
  <!-- Hat -->
  <rect x="38" y="8" width="44" height="18" rx="4" fill="url(#toyHat)"/>
  <rect x="42" y="0" width="36" height="12" rx="3" fill="#4a3020"/>
  <!-- Eyes -->
  <circle cx="50" cy="42" r="4" fill="#2d1a0a"/>
  <circle cx="70" cy="42" r="4" fill="#2d1a0a"/>
  <circle cx="51" cy="41" r="1.5" fill="white" opacity="0.7"/>
  <circle cx="71" cy="41" r="1.5" fill="white" opacity="0.7"/>
  <!-- Glasses -->
  <circle cx="50" cy="42" r="7" fill="none" stroke="#3d2a18" stroke-width="1.5"/>
  <circle cx="70" cy="42" r="7" fill="none" stroke="#3d2a18" stroke-width="1.5"/>
  <line x1="57" y1="42" x2="63" y2="42" stroke="#3d2a18" stroke-width="1.5"/>
  <!-- Smile -->
  <path d="M52 55 Q60 64 68 55" stroke="#2d1a0a" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Mustache -->
  <path d="M46 50 Q53 48 60 50 Q67 48 74 50" stroke="#4a3020" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Arms -->
  <rect x="20" y="68" width="15" height="8" rx="4" fill="#d4a574"/>
  <rect x="85" y="68" width="15" height="8" rx="4" fill="#d4a574"/>
  <!-- Tiny gear badge -->
  <circle cx="60" cy="88" r="6" fill="#ffd700" opacity="0.6" stroke="#b8960a" stroke-width="0.5"/>
</svg>