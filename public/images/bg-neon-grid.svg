<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0a2e"/>
      <stop offset="50%" stop-color="#1a0a3e"/>
      <stop offset="100%" stop-color="#0d0d2b"/>
    </linearGradient>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M 80 0 L 0 0 0 80" fill="none" stroke="#00f0ff" stroke-width="0.5" opacity="0.15"/>
    </pattern>
    <pattern id="gridGlow" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M 160 0 L 0 0 0 160" fill="none" stroke="#ff00ff" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#gridGlow)"/>
  <circle cx="200" cy="200" r="3" fill="#00f0ff" opacity="0.8"/>
  <circle cx="1700" cy="800" r="2" fill="#ff00ff" opacity="0.6"/>
  <circle cx="900" cy="500" r="4" fill="#00f0ff" opacity="0.4"/>
  <circle cx="300" cy="900" r="2" fill="#ff00ff" opacity="0.5"/>
  <circle cx="1500" cy="200" r="3" fill="#00f0ff" opacity="0.7"/>
  <circle cx="1200" cy="700" r="2" fill="#ff00ff" opacity="0.3"/>
</svg>
