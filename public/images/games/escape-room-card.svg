<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="50%" stop-color="#16213e"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#g)"/>
  <!-- Bookshelf -->
  <rect x="150" y="120" width="300" height="220" rx="4" fill="#2c1810" stroke="#5c3a28" stroke-width="3"/>
  <rect x="170" y="135" width="70" height="190" rx="2" fill="#1a3a5c"/>
  <rect x="250" y="135" width="55" height="190" rx="2" fill="#5c1a1a"/>
  <rect x="315" y="135" width="70" height="190" rx="2" fill="#1a5c3a"/>
  <rect x="395" y="135" width="40" height="190" rx="2" fill="#5c3a1a"/>
  <!-- Desk -->
  <rect x="500" y="250" width="220" height="25" rx="3" fill="#5c3a28"/>
  <rect x="510" y="275" width="20" height="65" rx="2" fill="#3a2010"/>
  <rect x="690" y="275" width="20" height="65" rx="2" fill="#3a2010"/>
  <!-- Keypad on desk -->
  <rect x="540" y="210" width="100" height="40" rx="4" fill="#333" stroke="#555" stroke-width="2"/>
  <circle cx="562" cy="230" r="4" fill="#0f0"/>
  <circle cx="580" cy="230" r="4" fill="#0f0"/>
  <circle cx="598" cy="230" r="4" fill="#0f0"/>
  <circle cx="616" cy="230" r="4" fill="#f00"/>
  <!-- Globe -->
  <circle cx="780" cy="200" r="55" fill="#2244aa" stroke="#3355bb" stroke-width="3"/>
  <ellipse cx="760" cy="180" rx="25" ry="35" fill="#2244aa" opacity="0.6" stroke="#3355bb" stroke-width="1"/>
  <ellipse cx="800" cy="180" rx="25" ry="35" fill="#2244aa" opacity="0.6" stroke="#3355bb" stroke-width="1"/>
  <rect x="760" y="250" width="40" height="25" rx="3" fill="#5c3a28"/>
  <!-- Gears / Safe -->
  <circle cx="950" cy="300" r="45" fill="#555" stroke="#888" stroke-width="3"/>
  <circle cx="950" cy="300" r="30" fill="#666" stroke="#777" stroke-width="1"/>
  <circle cx="950" cy="300" r="10" fill="#333"/>
  <circle cx="930" cy="280" r="18" fill="#777" stroke="#999" stroke-width="2"/>
  <circle cx="970" cy="320" r="18" fill="#777" stroke="#999" stroke-width="2"/>
  <!-- Key being discovered -->
  <rect x="880" y="380" width="60" height="8" rx="2" fill="#fcd34d" transform="rotate(-15, 910, 384)"/>
  <circle cx="875" cy="384" r="10" fill="none" stroke="#fcd34d" stroke-width="3" transform="rotate(-15, 875, 384)"/>
  <!-- Title -->
  <text x="70" y="500" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="64" font-weight="700">ESCAPE ROOM</text>
  <text x="72" y="540" fill="#60a5fa" font-family="Segoe UI, Arial, sans-serif" font-size="28">Solve the puzzles • Find the key</text>
  <text x="72" y="575" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="18">Professor Aldric's Study</text>
</svg>