<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0033"/>
      <stop offset="50%" stop-color="#2d1050"/>
      <stop offset="100%" stop-color="#0d001a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>
  <!-- Rune circle -->
  <circle cx="200" cy="130" r="70" stroke="#9b59b6" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="200" cy="130" r="55" stroke="#8e44ad" stroke-width="0.5" fill="none" opacity="0.4" stroke-dasharray="4 4"/>
  <!-- Runes -->
  <g filter="url(#glow)" opacity="0.9">
    <text x="160" y="115" fill="#e8c4f8" font-size="22" font-family="serif">ᚱ</text>
    <text x="225" y="115" fill="#c39bdb" font-size="22" font-family="serif">ᛗ</text>
    <text x="170" y="155" fill="#d4a5e5" font-size="22" font-family="serif">ᛟ</text>
    <text x="215" y="155" fill="#b07cc6" font-size="22" font-family="serif">ᚹ</text>
    <text x="192" y="180" fill="#9b59b6" font-size="22" font-family="serif">ᛞ</text>
  </g>
  <!-- Title -->
  <text x="200" y="240" fill="#e8c4f8" font-size="28" font-weight="bold" font-family="serif" text-anchor="middle" filter="url(#glow)">Spell Craft</text>
  <text x="200" y="265" fill="#9b59b6" font-size="12" font-family="sans-serif" text-anchor="middle" opacity="0.8">Glyph Weaving · Puzzle</text>
</svg>