<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="gwBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a0a2e"/><stop offset="50%" stop-color="#2d1b4e"/><stop offset="100%" stop-color="#0d0520"/>
    </linearGradient>
    <filter id="gwGlow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="400" height="300" fill="url(#gwBg)"/>
  <!-- Outer ring -->
  <circle cx="200" cy="115" r="70" stroke="#9b59b6" stroke-width="1.5" fill="none" opacity="0.6"/>
  <circle cx="200" cy="115" r="65" stroke="#8e44ad" stroke-width="0.5" fill="none" opacity="0.3" stroke-dasharray="4 6"/>
  <!-- Inner ring -->
  <circle cx="200" cy="115" r="40" stroke="#6c3483" stroke-width="1" fill="none" opacity="0.4"/>
  <!-- Sigil inside ring -->
  <g filter="url(#gwGlow)" opacity="0.9">
    <path d="M175 105 L190 80 L205 105" stroke="#e8c4f8" stroke-width="1.5" fill="none"/>
    <path d="M200 85 L200 145" stroke="#c39bdb" stroke-width="1.5"/>
    <path d="M190 125 L210 125" stroke="#d4a5e5" stroke-width="1.5"/>
    <circle cx="200" cy="115" r="6" fill="none" stroke="#b07cc6" stroke-width="1"/>
  </g>
  <!-- Rune marks around ring -->
  <g opacity="0.4">
    <text x="200" y="55" fill="#9b59b6" font-size="10" text-anchor="middle">✦</text>
    <text x="200" y="185" fill="#9b59b6" font-size="10" text-anchor="middle">✦</text>
    <text x="135" y="118" fill="#9b59b6" font-size="10" text-anchor="middle">✦</text>
    <text x="265" y="118" fill="#9b59b6" font-size="10" text-anchor="middle">✦</text>
  </g>
  <!-- Particle dots -->
  <g opacity="0.3">
    <circle cx="160" cy="80" r="1.5" fill="#e8c4f8"/><circle cx="240" cy="70" r="1" fill="#d4a5e5"/>
    <circle cx="250" cy="150" r="1.5" fill="#e8c4f8"/><circle cx="150" cy="160" r="1" fill="#d4a5e5"/>
    <circle cx="180" cy="180" r="1" fill="#e8c4f8"/><circle cx="220" cy="50" r="1" fill="#d4a5e5"/>
  </g>
  <!-- Title -->
  <text x="200" y="235" fill="#e8c4f8" font-size="24" font-weight="bold" text-anchor="middle" filter="url(#gwGlow)">Glyph Weaver</text>
  <text x="200" y="260" fill="#9b59b6" font-size="11" text-anchor="middle" opacity="0.8">Spell Crafting Studio · WebGL</text>
  <text x="200" y="278" fill="#6c3483" font-size="9" text-anchor="middle" opacity="0.5">Draw · Weave · Cast</text>
</svg>