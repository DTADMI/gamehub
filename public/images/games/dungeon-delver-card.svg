<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d1a"/>
      <stop offset="100%" stop-color="#1a1a3e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd700"/>
      <stop offset="100%" stop-color="#ff8c00"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)" rx="12"/>
  <!-- Dungeon entrance -->
  <rect x="120" y="80" width="160" height="180" rx="8" fill="#1a1a2e" stroke="#333" stroke-width="2"/>
  <rect x="140" y="100" width="120" height="140" rx="4" fill="#0d0d1a"/>
  <!-- Torches -->
  <rect x="115" y="75" width="10" height="25" rx="3" fill="#8B4513"/>
  <circle cx="120" cy="72" r="6" fill="#ff6600" opacity="0.8"/>
  <rect x="275" y="75" width="10" height="25" rx="3" fill="#8B4513"/>
  <circle cx="280" cy="72" r="6" fill="#ff6600" opacity="0.8"/>
  <!-- Sword -->
  <rect x="175" y="130" width="8" height="70" rx="3" fill="#c0c0c0"/>
  <rect x="185" y="135" width="25" height="8" rx="3" fill="#c0c0c0"/>
  <rect x="175" y="95" width="8" height="20" rx="3" fill="#8B4513"/>
  <rect x="170" y="90" width="18" height="8" rx="3" fill="#8B4513"/>
  <!-- Skull -->
  <circle cx="220" cy="160" r="15" fill="#e0e0e0" opacity="0.6"/>
  <circle cx="214" cy="157" r="3" fill="#0d0d1a"/>
  <circle cx="226" cy="157" r="3" fill="#0d0d1a"/>
  <rect x="216" y="166" width="8" height="6" rx="1" fill="#0d0d1a"/>
  <!-- Title -->
  <text x="200" y="290" text-anchor="middle" font-family="monospace" font-size="28" font-weight="bold" fill="url(#title)">DUNGEON DELVER</text>
</svg>