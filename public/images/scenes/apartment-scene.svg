<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="aptWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1018"/><stop offset="100%" stop-color="#2d1b2a"/>
    </linearGradient>
    <linearGradient id="aptFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2d1b2a"/><stop offset="100%" stop-color="#150a12"/>
    </linearGradient>
    <filter id="noise3">
      <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect width="1200" height="580" fill="url(#aptWall)"/>
  <rect y="580" width="1200" height="220" fill="url(#aptFloor)"/>
  <!-- Wallpaper pattern -->
  <g opacity="0.06">
    <pattern id="wallpaper" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <circle cx="40" cy="40" r="15" fill="#e8c4f8"/><circle cx="0" cy="0" r="15" fill="#e8c4f8"/>
      <circle cx="80" cy="0" r="15" fill="#e8c4f8"/><circle cx="0" cy="80" r="15" fill="#e8c4f8"/>
      <circle cx="80" cy="80" r="15" fill="#e8c4f8"/>
    </pattern>
    <rect width="1200" height="580" fill="url(#wallpaper)"/>
  </g>
  <!-- Floor boards -->
  <g opacity="0.12" stroke="#805060" stroke-width="0.5">
    <line x1="0" y1="610" x2="1200" y2="610"/><line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="0" y1="670" x2="1200" y2="670"/><line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="0" y1="730" x2="1200" y2="730"/><line x1="0" y1="760" x2="1200" y2="760"/>
  </g>
  <!-- Rug -->
  <ellipse cx="600" cy="660" rx="300" ry="60" fill="#3d1b3a" opacity="0.3"/>
  <!-- Window -->
  <rect x="200" y="100" width="350" height="280" rx="4" fill="#0a1628" stroke="#603050" stroke-width="4"/>
  <line x1="375" y1="100" x2="375" y2="380" stroke="#603050" stroke-width="3"/>
  <line x1="200" y1="240" x2="550" y2="240" stroke="#603050" stroke-width="3"/>
  <!-- Curtains -->
  <path d="M190 90 Q210 200 195 390" stroke="#4a2040" stroke-width="8" fill="none" opacity="0.5"/>
  <path d="M560 90 Q540 200 555 390" stroke="#4a2040" stroke-width="8" fill="none" opacity="0.5"/>
  <!-- Stars through window -->
  <g opacity="0.15" fill="#fff">
    <circle cx="250" cy="160" r="1.5"/><circle cx="300" cy="140" r="1"/>
    <circle cx="350" cy="180" r="1.5"/><circle cx="420" cy="155" r="1"/>
    <circle cx="480" cy="170" r="1.5"/><circle cx="270" cy="200" r="1"/>
    <circle cx="500" cy="130" r="1"/><circle cx="330" cy="220" r="1.5"/>
  </g>
  <!-- Bookshelf -->
  <rect x="650" y="120" width="180" height="350" rx="3" fill="#2d1028" stroke="#4a2040" stroke-width="1" opacity="0.5"/>
  <line x1="650" y1="200" x2="830" y2="200" stroke="#4a2040" stroke-width="1"/>
  <line x1="650" y1="280" x2="830" y2="280" stroke="#4a2040" stroke-width="1"/>
  <line x1="650" y1="360" x2="830" y2="360" stroke="#4a2040" stroke-width="1"/>
  <!-- Books on shelf -->
  <g opacity="0.3">
    <rect x="660" y="130" width="10" height="60" rx="1" fill="#803060"/><rect x="673" y="140" width="8" height="50" rx="1" fill="#305080"/>
    <rect x="685" y="135" width="12" height="55" rx="1" fill="#508030"/><rect x="700" y="125" width="9" height="65" rx="1" fill="#803030"/>
    <rect x="660" y="210" width="12" height="60" rx="1" fill="#306080"/><rect x="676" y="220" width="8" height="50" rx="1" fill="#803060"/>
    <rect x="690" y="215" width="10" height="55" rx="1" fill="#508050"/>
  </g>
  <!-- Framed photos on wall -->
  <g opacity="0.4">
    <rect x="880" y="150" width="80" height="60" rx="2" fill="#2d1028" stroke="#805060" stroke-width="2"/>
    <rect x="890" y="157" width="60" height="46" rx="1" fill="#1a0a12"/>
    <rect x="880" y="250" width="60" height="80" rx="2" fill="#2d1028" stroke="#805060" stroke-width="2"/>
    <rect x="888" y="258" width="44" height="64" rx="1" fill="#1a0a12"/>
  </g>
  <!-- Coffee table -->
  <rect x="350" y="530" width="300" height="12" rx="3" fill="#3d1b30" stroke="#603050" stroke-width="1" opacity="0.6"/>
  <rect x="370" y="542" width="8" height="38" rx="1" fill="#2d1028" opacity="0.5"/>
  <rect x="622" y="542" width="8" height="38" rx="1" fill="#2d1028" opacity="0.5"/>
  <!-- Items on coffee table -->
  <g opacity="0.4">
    <circle cx="430" cy="520" r="15" fill="#4a2060" stroke="#6a3080" stroke-width="0.5"/>
    <rect x="480" y="510" width="40" height="20" rx="3" fill="#3d1b50"/>
    <circle cx="555" cy="522" r="8" fill="#804020"/>
  </g>
  <!-- Couch silhouette -->
  <rect x="100" y="470" width="400" height="110" rx="15" fill="#1a0a12" opacity="0.4"/>
  <rect x="100" y="470" width="400" height="40" rx="15" fill="#2d1028" opacity="0.3"/>
  <!-- Lamp -->
  <line x1="850" y1="220" x2="880" y2="500" stroke="#4a2040" stroke-width="2" opacity="0.4"/>
  <ellipse cx="880" cy="510" rx="30" ry="15" fill="#6a3080" opacity="0.15"/>
  <rect width="1200" height="800" fill="url(#noise3)" opacity="0.06"/>
</svg>