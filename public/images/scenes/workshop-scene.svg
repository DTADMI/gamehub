<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a120b"/><stop offset="100%" stop-color="#2d1f12"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d2a18"/><stop offset="100%" stop-color="#1a0f08"/>
    </linearGradient>
    <linearGradient id="light" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="noise"/>
    </filter>
  </defs>
  <!-- Wall -->
  <rect width="1200" height="600" fill="url(#wall)"/>
  <!-- Floor -->
  <rect y="600" width="1200" height="200" fill="url(#floor)"/>
  <!-- Floor boards -->
  <g opacity="0.15" stroke="#8b6914" stroke-width="0.5">
    <line x1="0" y1="620" x2="1200" y2="620"/><line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="0" y1="660" x2="1200" y2="660"/><line x1="0" y1="680" x2="1200" y2="680"/>
    <line x1="0" y1="700" x2="1200" y2="700"/><line x1="0" y1="720" x2="1200" y2="720"/>
  </g>
  <!-- Light pool from hanging lamp -->
  <ellipse cx="600" cy="500" rx="350" ry="200" fill="url(#light)"/>
  <!-- Hanging lamp -->
  <line x1="600" y1="0" x2="600" y2="120" stroke="#8b7355" stroke-width="2"/>
  <ellipse cx="600" cy="140" rx="30" ry="20" fill="#3d2a18" stroke="#8b7355" stroke-width="1.5"/>
  <ellipse cx="600" cy="140" rx="15" ry="10" fill="#ffd700" opacity="0.3"/>
  <!-- Shelves on wall -->
  <g opacity="0.6">
    <rect x="50" y="200" width="250" height="8" rx="2" fill="#5c3d2e"/>
    <rect x="50" y="350" width="200" height="8" rx="2" fill="#5c3d2e"/>
    <rect x="900" y="200" width="250" height="8" rx="2" fill="#5c3d2e"/>
  </g>
  <!-- Shelf items - toys/gears silhouettes -->
  <g opacity="0.3" fill="#8b7355">
    <circle cx="100" cy="190" r="12"/><circle cx="145" cy="190" r="8"/>
    <circle cx="180" cy="190" r="15"/><rect x="220" y="175" width="20" height="20" rx="3"/>
    <circle cx="950" cy="190" r="10"/><circle cx="990" cy="190" r="14"/>
    <rect x="1030" y="178" width="18" height="18" rx="4"/>
    <rect x="70" y="338" width="16" height="16" rx="3"/>
    <circle cx="110" cy="340" r="9"/><rect x="140" y="334" width="20" height="20" rx="2"/>
  </g>
  <!-- Workbench -->
  <rect x="200" y="540" width="800" height="20" rx="3" fill="#4a3020" stroke="#6b4f33" stroke-width="1"/>
  <rect x="220" y="560" width="15" height="60" rx="2" fill="#3d2a18"/>
  <rect x="965" y="560" width="15" height="60" rx="2" fill="#3d2a18"/>
  <!-- Workbench items -->
  <g opacity="0.4">
    <circle cx="400" cy="530" r="18" fill="#8b7355" stroke="#a08060" stroke-width="1"/>
    <circle cx="450" cy="530" r="12" fill="#6b4f33" stroke="#8b6914" stroke-width="1"/>
    <rect x="550" y="512" width="20" height="20" rx="3" fill="#5c3d2e"/>
    <rect x="650" y="510" width="30" height="25" rx="4" fill="#3d2a18" stroke="#6b4f33" stroke-width="0.5"/>
    <circle cx="780" cy="530" r="16" fill="#4a3020" stroke="#7a5a3a" stroke-width="1"/>
  </g>
  <!-- Window -->
  <rect x="450" y="100" width="300" height="220" rx="4" fill="#0a1628" stroke="#5c3d2e" stroke-width="4"/>
  <line x1="600" y1="100" x2="600" y2="320" stroke="#5c3d2e" stroke-width="3"/>
  <line x1="450" y1="210" x2="750" y2="210" stroke="#5c3d2e" stroke-width="3"/>
  <!-- Moonlight through window -->
  <ellipse cx="550" cy="170" rx="60" ry="40" fill="#1a3a6e" opacity="0.3"/>
  <!-- Noise overlay for atmosphere -->
  <rect width="1200" height="800" fill="url(#noise)" opacity="0.08"/>
</svg>