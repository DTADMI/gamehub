<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="homeWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1410"/><stop offset="100%" stop-color="#2d2218"/>
    </linearGradient>
    <linearGradient id="homeFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d3020"/><stop offset="100%" stop-color="#1a1410"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="580" fill="url(#homeWall)"/>
  <rect y="580" width="1200" height="220" fill="url(#homeFloor)"/>
  <!-- Warm wallpaper pattern -->
  <g opacity="0.04">
    <pattern id="homePattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <circle cx="30" cy="30" r="8" fill="#d4a050"/>
    </pattern>
    <rect width="1200" height="580" fill="url(#homePattern)"/>
  </g>
  <!-- Floor -->
  <g opacity="0.08" stroke="#a08050" stroke-width="0.5">
    <line x1="0" y1="610" x2="1200" y2="610"/><line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="0" y1="670" x2="1200" y2="670"/><line x1="0" y1="700" x2="1200" y2="700"/>
    <line x1="0" y1="730" x2="1200" y2="730"/>
  </g>
  <!-- Rug -->
  <ellipse cx="500" cy="680" rx="250" ry="45" fill="#4a3020" opacity="0.2"/>
  <!-- Warm lamp glow -->
  <ellipse cx="500" cy="450" rx="300" ry="200" fill="#ffd700" opacity="0.04"/>
  <!-- Window -->
  <rect x="150" y="100" width="350" height="280" rx="4" fill="#0a1628" stroke="#6b4f33" stroke-width="4"/>
  <line x1="325" y1="100" x2="325" y2="380" stroke="#6b4f33" stroke-width="3"/>
  <line x1="150" y1="240" x2="500" y2="240" stroke="#6b4f33" stroke-width="3"/>
  <!-- Curtains -->
  <path d="M140 90 Q160 200 145 390" stroke="#805030" stroke-width="6" fill="none" opacity="0.3"/>
  <path d="M510 90 Q490 200 505 390" stroke="#805030" stroke-width="6" fill="none" opacity="0.3"/>
  <!-- Night sky through window -->
  <g opacity="0.12" fill="#ffd">
    <circle cx="190" cy="160" r="1.5"/><circle cx="240" cy="145" r="1"/>
    <circle cx="300" cy="175" r="1.5"/><circle cx="370" cy="150" r="1"/>
    <circle cx="430" cy="165" r="1"/><circle cx="210" cy="200" r="1"/>
    <circle cx="460" cy="140" r="1.5"/>
  </g>
  <!-- Couch -->
  <rect x="650" y="430" width="400" height="120" rx="20" fill="#3d2010" opacity="0.3"/>
  <rect x="650" y="430" width="400" height="45" rx="20" fill="#4a2818" opacity="0.25"/>
  <!-- Coffee table -->
  <rect x="550" y="540" width="250" height="10" rx="3" fill="#3d2818" stroke="#604020" stroke-width="0.5" opacity="0.4"/>
  <rect x="570" y="550" width="8" height="30" fill="#2d1808" opacity="0.3"/>
  <rect x="772" y="550" width="8" height="30" fill="#2d1808" opacity="0.3"/>
  <!-- Table items -->
  <g opacity="0.2">
    <rect x="610" y="520" width="30" height="20" rx="3" fill="#603020"/>
    <circle cx="690" cy="530" r="10" fill="#806030"/>
  </g>
  <!-- Bookshelf -->
  <rect x="1100" y="150" width="80" height="350" rx="3" fill="#2d1808" stroke="#4a3020" stroke-width="1" opacity="0.3"/>
  <line x1="1100" y1="230" x2="1180" y2="230" stroke="#4a3020" stroke-width="0.5"/>
  <line x1="1100" y1="310" x2="1180" y2="310" stroke="#4a3020" stroke-width="0.5"/>
  <line x1="1100" y1="390" x2="1180" y2="390" stroke="#4a3020" stroke-width="0.5"/>
  <!-- Family photos on wall -->
  <g opacity="0.2">
    <rect x="850" y="150" width="60" height="80" rx="2" fill="#4a3020"/>
    <rect x="855" y="156" width="50" height="68" rx="1" fill="#2d1808"/>
    <rect x="930" y="170" width="50" height="60" rx="2" fill="#4a3020"/>
    <rect x="934" y="175" width="42" height="50" rx="1" fill="#2d1808"/>
  </g>
</svg>