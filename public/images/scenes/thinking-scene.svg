<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="thinkBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a1a"/><stop offset="50%" stop-color="#101030"/><stop offset="100%" stop-color="#0a0a1a"/>
    </linearGradient>
    <filter id="glowThink"><feGaussianBlur stdDeviation="4"/></filter>
  </defs>
  <rect width="1200" height="800" fill="url(#thinkBg)"/>
  <!-- Floating geometric shapes -->
  <g opacity="0.08">
    <circle cx="200" cy="300" r="80" fill="none" stroke="#6060ff" stroke-width="1.5" stroke-dasharray="10 5"/>
    <rect x="800" y="200" width="120" height="120" rx="8" fill="none" stroke="#6060ff" stroke-width="1.5" stroke-dasharray="8 6" transform="rotate(15 860 260)"/>
    <polygon points="550,150 600,250 500,250" fill="none" stroke="#6060ff" stroke-width="1.5" stroke-dasharray="6 6"/>
  </g>
  <!-- Neural network nodes -->
  <g opacity="0.2">
    <circle cx="150" cy="150" r="4" fill="#8080ff" filter="url(#glowThink)"/>
    <circle cx="300" cy="100" r="3" fill="#6060ff"/>
    <circle cx="450" cy="200" r="5" fill="#8080ff" filter="url(#glowThink)"/>
    <circle cx="600" cy="150" r="3.5" fill="#6060ff"/>
    <circle cx="750" cy="250" r="4.5" fill="#8080ff" filter="url(#glowThink)"/>
    <circle cx="900" cy="180" r="3" fill="#6060ff"/>
    <circle cx="1050" cy="300" r="4" fill="#8080ff" filter="url(#glowThink)"/>
    <circle cx="200" cy="400" r="3.5" fill="#6060ff"/>
    <circle cx="500" cy="450" r="4" fill="#8080ff" filter="url(#glowThink)"/>
    <circle cx="800" cy="500" r="3" fill="#6060ff"/>
    <circle cx="350" cy="550" r="4.5" fill="#8080ff" filter="url(#glowThink)"/>
    <circle cx="650" cy="600" r="3.5" fill="#6060ff"/>
    <circle cx="950" cy="650" r="4" fill="#8080ff" filter="url(#glowThink)"/>
  </g>
  <!-- Connections -->
  <g opacity="0.08" stroke="#6060ff" stroke-width="0.5">
    <line x1="150" y1="150" x2="300" y2="100"/><line x1="300" y1="100" x2="450" y2="200"/>
    <line x1="450" y1="200" x2="600" y2="150"/><line x1="600" y1="150" x2="750" y2="250"/>
    <line x1="750" y1="250" x2="900" y2="180"/><line x1="900" y1="180" x2="1050" y2="300"/>
    <line x1="200" y1="400" x2="350" y2="550"/><line x1="500" y1="450" x2="650" y2="600"/>
    <line x1="350" y1="550" x2="500" y2="450"/><line x1="650" y1="600" x2="800" y2="500"/>
    <line x1="800" y1="500" x2="950" y2="650"/>
    <line x1="300" y1="100" x2="200" y2="400"/><line x1="600" y1="150" x2="500" y2="450"/>
    <line x1="900" y1="180" x2="800" y2="500"/>
  </g>
  <!-- Faint question marks -->
  <g opacity="0.06" fill="#a0a0ff" font-size="80" font-family="serif">
    <text x="350" y="350">?</text><text x="750" y="450">?</text>
  </g>
</svg>