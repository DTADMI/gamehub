<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" fill="none">
  <defs>
    <linearGradient id="officeWall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0a1a"/><stop offset="100%" stop-color="#1a1530"/>
    </linearGradient>
    <linearGradient id="officeFloor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1530"/><stop offset="100%" stop-color="#0a0815"/>
    </linearGradient>
    <filter id="noise2">
      <feTurbulence type="fractalNoise" baseFrequency="0.7" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply"/>
    </filter>
  </defs>
  <rect width="1200" height="600" fill="url(#officeWall)"/>
  <rect y="600" width="1200" height="200" fill="url(#officeFloor)"/>
  <!-- Wainscoting -->
  <rect y="450" width="1200" height="150" fill="#100d20" opacity="0.5"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="#2a2050" stroke-width="1.5" opacity="0.5"/>
  <!-- Bookshelves -->
  <g opacity="0.4">
    <rect x="60" y="80" width="200" height="370" rx="3" fill="#150f28" stroke="#2a2050" stroke-width="1"/>
    <line x1="60" y1="170" x2="260" y2="170" stroke="#2a2050" stroke-width="1"/>
    <line x1="60" y1="260" x2="260" y2="260" stroke="#2a2050" stroke-width="1"/>
    <line x1="60" y1="350" x2="260" y2="350" stroke="#2a2050" stroke-width="1"/>
    <!-- Books -->
    <rect x="70" y="90" width="12" height="70" rx="1" fill="#3a2080"/><rect x="85" y="100" width="10" height="60" rx="1" fill="#2050a0"/>
    <rect x="98" y="95" width="14" height="65" rx="1" fill="#803a20"/><rect x="115" y="85" width="8" height="75" rx="1" fill="#208050"/>
    <rect x="130" y="100" width="11" height="60" rx="1" fill="#5020a0"/><rect x="145" y="90" width="9" height="70" rx="1" fill="#a02050"/>
    <rect x="70" y="180" width="14" height="70" rx="1" fill="#402080"/><rect x="90" y="190" width="10" height="60" rx="1" fill="#208040"/>
    <rect x="105" y="185" width="8" height="65" rx="1" fill="#804020"/><rect x="120" y="175" width="12" height="75" rx="1" fill="#206080"/>
  </g>
  <rect x="940" y="80" width="200" height="370" rx="3" fill="#150f28" stroke="#2a2050" stroke-width="1" opacity="0.4"/>
  <!-- Desk -->
  <rect x="350" y="480" width="500" height="15" rx="3" fill="#1a1030" stroke="#3a2860" stroke-width="1"/>
  <rect x="370" y="495" width="12" height="105" rx="2" fill="#120d25"/>
  <rect x="828" y="495" width="12" height="105" rx="2" fill="#120d25"/>
  <!-- Desk items -->
  <g opacity="0.35">
    <rect x="420" y="455" width="60" height="25" rx="3" fill="#2a2050"/><!-- papers -->
    <rect x="500" y="460" width="30" height="20" rx="2" fill="#3a2860"/><!-- inkwell -->
    <circle cx="590" cy="470" r="8" fill="#4a3070"/><!-- magnifying glass -->
    <rect x="640" y="458" width="40" height="22" rx="2" fill="#2a1850"/><!-- book -->
    <rect x="700" y="460" width="25" height="20" rx="2" fill="#3a2060"/><!-- stamp -->
  </g>
  <!-- Coded letter on desk -->
  <rect x="420" y="455" width="55" height="20" rx="1" fill="#f5e6c8" opacity="0.15"/>
  <g opacity="0.1" fill="#fff" font-size="6" font-family="monospace">
    <text x="425" y="466">XKLIW</text><text x="425" y="472">S</text>
  </g>
  <!-- Filing cabinets on right -->
  <g opacity="0.5">
    <rect x="1040" y="380" width="90" height="70" rx="2" fill="#1a1030" stroke="#3a2860" stroke-width="1"/>
    <rect x="1044" y="385" width="82" height="3" fill="#3a2860"/>
    <rect x="1075" y="410" width="18" height="10" rx="1" fill="#4a3070"/>
    <rect x="1040" y="455" width="90" height="70" rx="2" fill="#1a1030" stroke="#3a2860" stroke-width="1"/>
    <rect x="1044" y="460" width="82" height="3" fill="#3a2860"/>
    <rect x="1075" y="485" width="18" height="10" rx="1" fill="#4a3070"/>
    <text x="1055" y="440" fill="#3a2860" font-size="7" font-family="sans-serif">A</text>
    <text x="1055" y="515" fill="#3a2860" font-size="7" font-family="sans-serif">B</text>
  </g>
  <!-- Desk lamp glow -->
  <ellipse cx="590" cy="480" rx="180" ry="100" fill="#4a3080" opacity="0.08"/>
  <!-- Window -->
  <rect x="350" y="80" width="500" height="250" rx="4" fill="#0a0a1e" stroke="#2a2050" stroke-width="3"/>
  <line x1="600" y1="80" x2="600" y2="330" stroke="#2a2050" stroke-width="2"/>
  <line x1="350" y1="205" x2="850" y2="205" stroke="#2a2050" stroke-width="2"/>
  <!-- Moon through window -->
  <circle cx="650" cy="150" r="35" fill="#2a3a5a" opacity="0.2"/>
  <!-- Clock -->
  <circle cx="850" cy="200" r="40" fill="#150f28" stroke="#3a2860" stroke-width="2" opacity="0.6"/>
  <circle cx="850" cy="200" r="35" fill="#1a1030" opacity="0.4"/>
  <line x1="850" y1="200" x2="850" y2="175" stroke="#6a50a0" stroke-width="1.5" opacity="0.5"/>
  <line x1="850" y1="200" x2="865" y2="200" stroke="#6a50a0" stroke-width="1" opacity="0.5"/>
  <!-- Clock pendulum hint -->
  <line x1="850" y1="240" x2="850" y2="280" stroke="#3a2860" stroke-width="1" opacity="0.3"/>
  <circle cx="850" cy="285" r="8" fill="#4a3070" opacity="0.3"/>
  <rect width="1200" height="800" fill="url(#noise2)" opacity="0.06"/>
</svg>