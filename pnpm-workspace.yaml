packages:
  - packages/*
  - packages/games/*

allowBuilds:
  '@firebase/util': true
  esbuild: true
  protobufjs: true
  sharp: true

overrides:
  vite: 7.3.5
  ws: '>=8.21.0'
  '@xmldom/xmldom': '>=0.8.15'
  esbuild: '>=0.28.1'
  fflate: '>=0.6.11'

ignoredBuiltDependencies:
  - "@parcel/watcher"
  - "@prisma/engines"
  - "@scarf/scarf"

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@swc/core"
  - bcrypt
  - esbuild
  - prisma
  - sharp
  - supabase
  - unrs-resolver
